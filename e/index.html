<!-- The envelope says which language it was sealed in. Set before anything
     else reads <html lang>: play.js picks its words from it, and consent.js
     asks its question in it. Nothing from the link is written anywhere else
     here; envelope.js decodes it properly. -->
<script>(function(){try{var h=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(h.length%4)h+='=';var b=atob(h),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);var o=JSON.parse(new TextDecoder().decode(u));var m={es:'es-MX',pt:'pt-BR',fr:'fr-FR',de:'de-DE',ja:'ja'};if(o&&m[o.l])document.documentElement.lang=m[o.l];}catch(e){}})();</script>
